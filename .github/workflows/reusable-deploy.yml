name: Reusable Mule Deployment

on:
  workflow_call:

    # ============================================================
    # INPUTS
    # ============================================================

    inputs:

      environment:
        description: "Deployment environment"
        required: true
        type: string

      version:
        description: "Application version already published to Exchange by the build"
        required: true
        type: string


    # ============================================================
    # SECRETS
    # ============================================================

    secrets:

      ANYPOINT_CLIENT_ID:
        required: true

      ANYPOINT_CLIENT_SECRET:
        required: true

      ANYPOINT_ENVIRONMENT:
        required: true

      ANYPOINT_TARGET:
        required: true

      APPLICATION_NAME:
        required: true


# =================================================================
# JOBS
# =================================================================

jobs:

  deploy:

    name: Deploy to ${{ inputs.environment }}

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      contents: read


    steps:

      # ==========================================================
      # CHECKOUT SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5


      # ==========================================================
      # SETUP JAVA
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ==========================================================
      # DEPLOY TO CLOUDHUB 2.0
      #
      # CloudHub 2.0 pulls the application from Exchange using
      # groupId:artifactId:version, so -Drevision must match the
      # version published by the build.
      # ==========================================================

      - name: Deploy to CloudHub 2.0

        shell: bash

        # Read by .maven/settings.xml as ${env.ANYPOINT_CLIENT_ID} / ${env.ANYPOINT_CLIENT_SECRET}
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

        run: |

          set -euo pipefail

          echo "======================================"
          echo "Deploying Mule Application"
          echo "======================================"
          echo "Environment:  ${{ inputs.environment }}"
          echo "Application:  ${{ secrets.APPLICATION_NAME }}"
          echo "Version:      ${{ inputs.version }}"
          echo "======================================"

          mvn --batch-mode \
            --settings .maven/settings.xml \
            mule:deploy \
            -Drevision="${{ inputs.version }}" \
            -DapplicationName="${{ secrets.APPLICATION_NAME }}" \
            -Danypoint.environment="${{ secrets.ANYPOINT_ENVIRONMENT }}" \
            -Danypoint.target="${{ secrets.ANYPOINT_TARGET }}" \
            -DconnectedAppClientId="$ANYPOINT_CLIENT_ID" \
            -DconnectedAppClientSecret="$ANYPOINT_CLIENT_SECRET"

          echo "======================================"
          echo "Deployment completed successfully."
          echo "======================================"
