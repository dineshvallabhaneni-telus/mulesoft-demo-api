name: Reusable - Build Mule Application

on:
  workflow_call:
    outputs:
      version:
        description: "Mule application version"
        value: ${{ jobs.build.outputs.version }}

      artifact_name:
        description: "Mule application artifact name"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD MULE APPLICATION
  # ============================================================

  build:
    name: Build Mule Application

    runs-on: ubuntu-latest

    # ANYPOINT_CLIENT_ID / ANYPOINT_CLIENT_SECRET are environment secrets,
    # which are only visible to jobs that declare the environment.
    environment: dev

    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}

    steps:

      # ==========================================================
      # CHECKOUT SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # SETUP JAVA
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==========================================================
      # CALCULATE VERSION
      # ==========================================================

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # CloudHub 2.0 deploys the asset from Exchange, and Runtime Manager
          # names the file <artifactId>-<version>-mule-application.jar.
          # Branch and commit are therefore embedded in the version
          # (as a semver pre-release) so the naming convention is visible there.
          branchName="${GITHUB_REF_NAME//[^a-zA-Z0-9]/-}"
          commitHash=$(git rev-parse --short "$GITHUB_SHA")

          VERSION="1.0.${GITHUB_RUN_NUMBER}-${branchName}-${commitHash}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Mule Application Version: $VERSION"
          echo "======================================"


      # ==========================================================
      # BUILD AND PUBLISH TO EXCHANGE
      #
      # CloudHub 2.0 can only deploy applications stored in
      # Exchange, so the build publishes once here and every
      # environment deploys this same version.
      # ==========================================================

      - name: Build and publish to Exchange
        shell: bash
        # Read by .maven/settings.xml as ${env.ANYPOINT_CLIENT_ID} / ${env.ANYPOINT_CLIENT_SECRET}
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$ANYPOINT_CLIENT_ID" ] || [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::ANYPOINT_CLIENT_ID / ANYPOINT_CLIENT_SECRET are empty. Check the secrets exist for this job's environment."
            exit 1
          fi

          mvn --batch-mode \
            --settings .maven/settings.xml \
            clean deploy \
            -Drevision="${{ steps.version.outputs.version }}" \
            -DskipMunitTests


      # ==========================================================
      # STAMP ARTIFACT FILE NAME
      # ==========================================================

      - name: Stamp artifact file name
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          artifactPath=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -1)

          if [ -z "$artifactPath" ]; then
            echo "::error::No JAR found in target directory."
            exit 1
          fi

          artifactFile=$(basename "$artifactPath")

          # Remove .jar
          baseName="${artifactFile%.jar}"

          # Remove Mule application suffix
          # (branch and commit are already part of the version)
          baseName="${baseName%-mule-application}"

          artifactName="${baseName}.jar"

          mv "$artifactPath" "target/$artifactName"

          echo "======================================"
          echo "Original artifact:"
          echo "$artifactPath"
          echo ""
          echo "Final artifact:"
          echo "target/$artifactName"
          echo "======================================"

          echo "artifact_name=$artifactName" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # UPLOAD APPLICATION ARTIFACT
      # ==========================================================

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: target/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
