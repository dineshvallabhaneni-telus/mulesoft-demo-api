name: Reusable - Build Mule Application

on:
  workflow_call:
    outputs:
      version:
        description: "Mule application version"
        value: ${{ jobs.build.outputs.version }}

      artifact_name:
        description: "Mule application artifact name"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD MULE APPLICATION
  # ============================================================

  build:
    name: Build Mule Application

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}

    steps:

      # ==========================================================
      # CHECKOUT SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # SETUP JAVA
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==========================================================
      # CALCULATE VERSION
      # ==========================================================

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Mule Application Version: $VERSION"
          echo "======================================"


      # ==========================================================
      # BUILD WITH MAVEN
      # ==========================================================

      - name: Build with Maven
        shell: bash
        run: |
          set -euo pipefail

          mvn --batch-mode \
            --settings .maven/settings.xml \
            clean package \
            -Drevision="${{ steps.version.outputs.version }}" \
            -DskipMunitTests


      # ==========================================================
      # STAMP ARTIFACT FILE NAME
      # ==========================================================

      - name: Stamp artifact file name
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          artifactPath=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | head -1)

          if [ -z "$artifactPath" ]; then
            echo "::error::No JAR found in target directory."
            exit 1
          fi

          artifactFile=$(basename "$artifactPath")

          # Remove .jar
          baseName="${artifactFile%.jar}"

          # Remove Mule application suffix
          baseName="${baseName%-mule-application}"

          commitHash=$(git rev-parse --short "$GITHUB_SHA")

          branchName="${GITHUB_REF_NAME}"

          artifactName="${baseName}-${branchName}-${commitHash}.jar"

          mv "$artifactPath" "target/$artifactName"

          echo "======================================"
          echo "Original artifact:"
          echo "$artifactPath"
          echo ""
          echo "Final artifact:"
          echo "target/$artifactName"
          echo "======================================"

          echo "artifact_name=$artifactName" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # UPLOAD APPLICATION ARTIFACT
      # ==========================================================

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: target/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
