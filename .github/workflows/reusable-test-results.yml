name: Reusable - Test Results

on:
  workflow_call:


jobs:

  test-results:
    name: Test Results

    runs-on: ubuntu-latest

    environment: DEV

    permissions:
      contents: read

    steps:

      # ==========================================================
      # CHECK API KEY
      # ==========================================================

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        shell: bash

        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      # ==========================================================
      # NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet python-docx
          npm install --global --silent newman


      # ==========================================================
      # CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          npm install --global --silent @anthropic-ai/claude-code

      # ==========================================================
      # CHECKOUT CURRENT SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # CHECKOUT PREVIOUS SOURCE
      # ==========================================================

      - name: Checkout previous source
        run: |
          mkdir previous_ws
          git worktree add previous_ws HEAD~1


      # ==========================================================
      # CHECKOUT CLAUDE PROMPTS
      # ==========================================================

      - name: Checkout Claude Prompts
        uses: actions/checkout@v5
        with:
          repository: dineshvallabhaneni-telus/mulesoft-claude-postman
          ref: main
          path: claude-repo
          token: ${{ secrets.GIT_TOKEN }}


      # ==========================================================
      # STAGE VALIDATION FRAMEWORK
      #
      # The prompt runs "python3 scripts/<name>.py" from
      # $GITHUB_WORKSPACE, so the framework scripts and prompt must
      # sit at the workspace root. "scripts" and "Prompt" are in the
      # framework's COMPARISON_EXCLUDE; claude-repo/ is not, so it is
      # removed to keep it out of the source comparison.
      # ==========================================================

      - name: Stage validation framework
        shell: bash

        run: |
          set -euo pipefail

          cp -R claude-repo/scripts ./scripts
          cp -R claude-repo/Prompt  ./Prompt
          rm -rf claude-repo

          mkdir -p workspace/execution reports


      # ==========================================================
      # VERIFY WORKSPACE
      # ==========================================================

      - name: Verify workspace contract
        shell: bash

        run: |
          set -euo pipefail

          for dir in previous_ws postman_collection scripts; do
            test -d "$dir" || {
              echo "::error::$dir/ is missing"
              exit 1
            }
          done

          for script in framework_config.py source_compare.py run_postman.py generate_report.py; do
            test -f "scripts/$script" || {
              echo "::error::scripts/$script is missing"
              exit 1
            }
          done

          test -f Prompt/prompt.md || {
            echo "::error::Prompt/prompt.md is missing"
            exit 1
          }

          echo "previous_ws:        $(find previous_ws -type f | wc -l) files"
          echo "postman_collection: $(find postman_collection -type f | wc -l) files"
          echo "scripts:            $(ls scripts | tr '\n' ' ')"


      # ==========================================================
      # RUN TEST VALIDATION
      # ==========================================================

      - name: Run validation workflow
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional:
          # ANTHROPIC_MODEL: <fuel-model-id>

        run: |
          set -o pipefail

          cd "$GITHUB_WORKSPACE"

          cat Prompt/prompt.md | claude \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --output-format text \
            | tee validation-summary.txt


      # ==========================================================
      # GITHUB SUMMARY
      # ==========================================================

      - name: Publish summary
        if: always()

        run: |
          {
            echo "## MuleSoft Test Results"
            echo ""
            echo "Previous deployment ref: \`${PREVIOUS_DEPLOYMENT_REF:-unknown}\`"
            echo ""
            echo '```'
            cat validation-summary.txt 2>/dev/null || echo "No summary produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ==========================================================
      # UPLOAD TEST REPORT
      # ==========================================================

      - name: Upload test report
        if: always()

        uses: actions/upload-artifact@v7

        with:
          name: mulesoft-test-results

          path: |
            reports/*.docx
            workspace/execution/*.json
            validation-summary.txt

          if-no-files-found: warn

          retention-days: 90


      # ==========================================================
      # TEST RESULT
      # ==========================================================

      - name: Fail the job on failed tests
        if: always()

        shell: bash

        run: |
          set -euo pipefail

          if ! grep -q '^Overall Status: PASS' validation-summary.txt; then
            echo "::error::Test Results did not pass. See the uploaded report."
            exit 1
          fi