name: Reusable - Test Results

on:
  workflow_call:


jobs:

  test-results:
    name: Test Results

    runs-on: ubuntu-latest

    environment: DEV

    permissions:
      contents: read

    steps:

      # ==========================================================
      # CHECK API KEY
      # ==========================================================

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        shell: bash

        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      # ==========================================================
      # NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet python-docx
          npm install --global --silent newman


      # ==========================================================
      # CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          npm install --global --silent @anthropic-ai/claude-code


      # ==========================================================
      # TEST CLAUDE API
      # ==========================================================

      - name: Test Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Testing Claude API..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            --request POST \
            https://api.fuelix.ai/v1/chat/completions \
            -H "Authorization: Bearer $ANTHROPIC_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{
              "model": "claude-sonnet-4-6",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: Claude API"
                }
              ]
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          if ! echo "$BODY" | jq empty >/dev/null 2>&1; then
            echo "::error::Claude API returned invalid JSON."
            exit 1
          fi

          CLAUDE_RESPONSE=$(echo "$BODY" | jq -r \
            '.choices[0].message.content // empty')

          echo "Claude response: $CLAUDE_RESPONSE"

          if [ "$CLAUDE_RESPONSE" != "Claude API" ]; then
            echo "::error::Unexpected Claude API response."
            echo "::error::Expected: Claude API"
            echo "::error::Received: $CLAUDE_RESPONSE"
            exit 1
          fi

          MODEL=$(echo "$BODY" | jq -r '.model // "unknown"')

          echo "Claude model: $MODEL"
          echo "Claude API test passed successfully."


      # ==========================================================
      # CHECKOUT CURRENT SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # CHECKOUT PREVIOUS SOURCE
      # ==========================================================

      - name: Checkout previous source
        run: |
          mkdir previous_ws
          git worktree add previous_ws HEAD~1


      # ==========================================================
      # CHECKOUT CLAUDE PROMPTS
      # ==========================================================

      - name: Checkout Claude Prompts
        uses: actions/checkout@v5
        with:
          repository: dineshvallabhaneni-telus/mulesoft-claude-postman
          ref: main
          path: claude-repo
          token: ${{ secrets.GIT_TOKEN }}


      # ==========================================================
      # VERIFY WORKSPACE
      # ==========================================================

      - name: Verify workspace contract
        shell: bash

        run: |
          set -euo pipefail

          test -d previous_ws || {
            echo "::error::previous_ws/ is missing"
            exit 1
          }

          test -d postman_collection || {
            echo "::error::postman_collection/ is missing"
            exit 1
          }

          echo "previous_ws:        $(find previous_ws -type f | wc -l) files"
          echo "postman_collection: $(find postman_collection -type f | wc -l) files"


      # ==========================================================
      # RUN TEST VALIDATION
      # ==========================================================

      - name: Run validation workflow
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional:
          # ANTHROPIC_MODEL: <fuel-model-id>

        run: |
          set -o pipefail

          cat "$GITHUB_WORKSPACE/claude-repo/Prompt/prompt.md" | claude \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --output-format text \
            | tee validation-summary.txt


      # ==========================================================
      # GITHUB SUMMARY
      # ==========================================================

      - name: Publish summary
        if: always()

        run: |
          {
            echo "## MuleSoft Test Results"
            echo ""
            echo "Previous deployment ref: \`${PREVIOUS_DEPLOYMENT_REF:-unknown}\`"
            echo ""
            echo '```'
            cat validation-summary.txt 2>/dev/null || echo "No summary produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ==========================================================
      # UPLOAD TEST REPORT
      # ==========================================================

      - name: Upload test report
        if: always()

        uses: actions/upload-artifact@v7

        with:
          name: mulesoft-test-results

          path: |
            reports/*.docx
            workspace/execution/*.json

          if-no-files-found: warn

          retention-days: 90


      # ==========================================================
      # TEST RESULT
      # ==========================================================

      - name: Fail the job on failed tests
        if: always()

        shell: bash

        run: |
          set -euo pipefail

          if ! grep -q '^Overall Status: PASS' validation-summary.txt; then
            echo "::error::Test Results did not pass. See the uploaded report."
            exit 1
          fi