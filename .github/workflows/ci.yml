name: Mule CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: mule-ci-develop
  cancel-in-progress: false

jobs:

  build:
    name: Build Mule Application

    uses: ./.github/workflows/reusable-build.yml

    secrets: inherit


  deploy-dev:
    name: Deploy ${{ needs.build.outputs.version }} to DEV

    needs:
      - build

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment: dev
      run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}

    secrets: inherit


  test-results:
    name: Test Results

    needs:
      - deploy-dev

    uses: ./.github/workflows/reusable-test-results.yml

    secrets: inherit


  mulesoft-code-review:
    name: MuleSoft Code Review

    needs:
      - build

    uses: ./.github/workflows/reusable-code-review.yml

    secrets: inherit