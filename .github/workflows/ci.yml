name: Mule CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: mule-ci-develop
  cancel-in-progress: false

jobs:

  build:

    name: Build Mule Application

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"

      - name: Build with Maven
        run: |
          mvn --batch-mode \
            --settings .maven/settings.xml \
            clean package \
            -Drevision="${{ steps.version.outputs.version }}" \
            -DskipMunitTests

      - name: Stamp artifact file name
        id: artifact
        shell: bash
        run: |
          artifactPath=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" |
            head -1)

          if [ -z "$artifactPath" ]; then
            echo "ERROR: No JAR found."
            exit 1
          fi

          artifactFile=$(basename "$artifactPath")

          # Remove .jar
          baseName="${artifactFile%.jar}"

          # Remove Mule application suffix
          baseName="${baseName%-mule-application}"

          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          branchName="${GITHUB_REF_NAME}"

          artifactName="${baseName}-${branchName}-${commitHash}.jar"

          mv "$artifactPath" "target/$artifactName"

          echo "======================================"
          echo "Original artifact:"
          echo "$artifactPath"
          echo ""
          echo "Final artifact:"
          echo "target/$artifactName"
          echo "======================================"

          echo "artifact_name=$artifactName" >> "$GITHUB_OUTPUT"

      - name: Upload application artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: target/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  deploy-dev:

    name: Deploy ${{ needs.build.outputs.version }} to DEV

    needs:
      - build

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment: dev
      run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}

    secrets: inherit

  claude-check:

    name: Check Claude API

    needs:
      - build

    runs-on: ubuntu-latest

    environment: DEV

    permissions:
      contents: read

    steps:

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."

      - name: Test Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing Claude API..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            --request POST \
            https://api.fuelix.ai/v1/chat/completions \
            -H "Authorization: Bearer $ANTHROPIC_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{
              "model": "claude-sonnet-4-6",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: Claude API"
                }
              ]
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          if ! echo "$BODY" | jq empty >/dev/null 2>&1; then
            echo "::error::Claude API returned invalid JSON."
            exit 1
          fi

          CLAUDE_RESPONSE=$(echo "$BODY" | jq -r \
            '.choices[0].message.content // empty')

          echo "Claude response: $CLAUDE_RESPONSE"

          if [ "$CLAUDE_RESPONSE" != "Claude API" ]; then
            echo "::error::Unexpected Claude API response."
            echo "::error::Expected: Claude API"
            echo "::error::Received: $CLAUDE_RESPONSE"
            exit 1
          fi

          MODEL=$(echo "$BODY" | jq -r '.model // "unknown"')

          echo "Claude model: $MODEL"
          echo "Claude API test passed successfully."


      - name: Checkout Claude Prompts
        uses: actions/checkout@v5
        with:
          repository: dineshvallabhaneni-telus/mulesoft-claude-postman
          ref: main
          path: claude-repo
          token: ${{ secrets.GIT_TOKEN }}

      - name: Show Workspace
        run: |
          echo "Workspace $GITHUB_WORKSPACE"
          pwd
          ls -la
          ls -la claude-repo

      - name: Load Claude Prompt
        shell: bash
        run: |
          set -euo pipefail

          echo "Claude repository:"
          ls -la claude-repo

          PROMPT_FILE="claude-repo/Prompt/prompt.md"

          if [ ! -f "$PROMPT_FILE" ]; then
            echo "::error::Prompt file not found: $PROMPT_FILE"
            exit 1
          fi

          echo "Prompt file found:"
          ls -lh "$PROMPT_FILE"

          echo "Claude prompt loaded successfully."



