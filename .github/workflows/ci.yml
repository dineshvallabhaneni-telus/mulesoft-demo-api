name: Mule CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: mule-ci-develop
  cancel-in-progress: false

jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build Mule Application

    uses: ./.github/workflows/reusable-build.yml

    secrets: inherit


  # ============================================================
  # DEPLOY TO DEV
  #
  # Runs after BUILD
  # ============================================================

  deploy-dev:
    name: Deploy ${{ needs.build.outputs.version }} to DEV

    needs:
      - build

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment: dev
      run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}

    secrets: inherit


  # ============================================================
  # TEST RESULTS
  #
  # Runs after DEPLOY DEV
  # ============================================================

  test-results:
    name: Test Results

    needs:
      - deploy-dev

    uses: ./.github/workflows/reusable-test-results.yml

    secrets: inherit


  # ============================================================
  # CODE REVIEW
  #
  # Runs after BUILD
  #
  # IMPORTANT:
  # This is independent of deployment and test results.
  # Therefore it runs in parallel with DEPLOY DEV.
  # ============================================================

  mulesoft-code-review:
    name: MuleSoft Code Review

    needs:
      - build

    uses: ./.github/workflows/reusable-code-review.yml

    secrets: inherit
