name: Mule CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: mule-ci-develop
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. BUILD
  # ============================================================

  build:
    name: Build Mule Application

    uses: ./.github/workflows/reusable-build.yml

    secrets: inherit


  # ============================================================
  # 2. DEPLOY TO DEV
  #
  # Starts after BUILD succeeds
  # ============================================================

  deploy-dev:
    name: Deploy ${{ needs.build.outputs.version }} to DEV

    needs:
      - build

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment: dev
      run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}

    secrets: inherit


  # ============================================================
  # 3. TEST RESULTS
  #
  # Starts ONLY after DEV deployment succeeds
  # ============================================================

  test-results:
    name: Test Results

    needs:
      - deploy-dev

    uses: ./.github/workflows/reusable-test-results.yml

    secrets: inherit


  # ============================================================
  # 4. CODE REVIEW
  #
  # Starts after BUILD succeeds.
  #
  # This runs IN PARALLEL with:
  #   - DEV deployment
  #   - Test Results
  #
  # It does NOT depend on deploy-dev.
  # ============================================================

  mulesoft-code-review:
    name: MuleSoft Code Review

    needs:
      - build

    uses: ./.github/workflows/reusable-code-review.yml

    secrets: inherit