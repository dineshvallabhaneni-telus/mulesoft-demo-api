name: Mule CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

concurrency:
  group: mule-ci-develop
  cancel-in-progress: false

jobs:

  build:

    name: Build Mule Application

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"

      - name: Build with Maven
        run: |
          mvn --batch-mode \
            --settings .maven/settings.xml \
            clean package \
            -Drevision="${{ steps.version.outputs.version }}" \
            -DskipMunitTests

      - name: Stamp artifact file name
        id: artifact
        shell: bash
        run: |
          artifactPath=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" |
            head -1)

          if [ -z "$artifactPath" ]; then
            echo "ERROR: No JAR found."
            exit 1
          fi

          artifactFile=$(basename "$artifactPath")

          # Remove .jar
          baseName="${artifactFile%.jar}"

          # Remove Mule application suffix
          baseName="${baseName%-mule-application}"

          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          branchName="${GITHUB_REF_NAME}"

          artifactName="${baseName}-${branchName}-${commitHash}.jar"

          mv "$artifactPath" "target/$artifactName"

          echo "======================================"
          echo "Original artifact:"
          echo "$artifactPath"
          echo ""
          echo "Final artifact:"
          echo "target/$artifactName"
          echo "======================================"

          echo "artifact_name=$artifactName" >> "$GITHUB_OUTPUT"

      - name: Upload application artifact
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: target/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  deploy-dev:

    name: Deploy ${{ needs.build.outputs.version }} to DEV

    needs:
      - build

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment: dev
      run_id: ${{ github.run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}

    secrets: inherit
