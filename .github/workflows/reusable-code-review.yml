      - name: Test Claude review JSON write
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLICATION_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          REVIEW_FILE="$APPLICATION_ROOT/workspace/execution/review.json"

          echo "=========================================================="
          echo "CLAUDE REVIEW.JSON WRITE TEST"
          echo "=========================================================="

          if ! command -v claude >/dev/null 2>&1; then
            echo "ERROR: Claude CLI is not installed."
            exit 1
          fi

          claude --version

          mkdir -p "$APPLICATION_ROOT/workspace/execution"
          rm -f "$REVIEW_FILE"

          echo
          echo "Application root:"
          echo "$APPLICATION_ROOT"

          echo
          echo "Expected review file:"
          echo "$REVIEW_FILE"

          echo
          echo "Starting Claude filesystem test..."
          echo

          claude \
            --dangerously-skip-permissions \
            "This is a filesystem and structured JSON write test.

          You MUST use the Write tool.

          Create exactly this file:

          $REVIEW_FILE

          The file must contain the following complete valid JSON:

          {
            \"application\": {
              \"name\": \"claude-write-test\",
              \"repository\": \"test-repository\",
              \"branch\": \"test\",
              \"commit\": \"test\",
              \"runtime\": \"Mule 4\",
              \"javaVersion\": \"17\",
              \"buildVersion\": \"test\",
              \"deploymentModel\": \"GitHub Actions\"
            },
            \"reviewType\": \"FULL_APPLICATION\",
            \"reviewDate\": \"2026-09-11\",
            \"reviewer\": \"Claude MuleSoft Code Review Agent\",
            \"overallRisk\": \"LOW\",
            \"overallRecommendation\": \"APPROVE\",
            \"executiveSummary\": \"Filesystem write capability test.\",
            \"reviewScope\": \"Test only.\",
            \"reviewMethodology\": \"Structured JSON filesystem write test.\",
            \"findings\": [
              {
                \"id\": \"TEST-001\",
                \"severity\": \"LOW\",
                \"category\": \"TEST\",
                \"title\": \"Filesystem write test\",
                \"location\": \"workspace/execution/review.json\",
                \"confidence\": \"HIGH\",
                \"problem\": \"No production issue. This is a filesystem write test.\",
                \"evidence\": \"Claude successfully created this structured review artifact.\",
                \"impact\": \"No production impact.\",
                \"recommendation\": \"No action required.\"
              }
            ],
            \"categoryAssessments\": {},
            \"productionReadiness\": \"Not Assessed\",
            \"positiveObservations\": [
              \"Claude can create the required structured review artifact.\"
            ],
            \"riskSummary\": \"No production risk. Test artifact only.\",
            \"remediationPriorities\": [],
            \"reviewLimitations\": [
              \"This is a filesystem capability test and not a MuleSoft application review.\"
            ],
            \"reviewCoverage\": {
              \"architecture\": \"Not Assessed\",
              \"muleXml\": \"Not Assessed\",
              \"dataWeave\": \"Not Assessed\",
              \"errorHandling\": \"Not Assessed\",
              \"security\": \"Not Assessed\",
              \"api\": \"Not Assessed\",
              \"logging\": \"Not Assessed\",
              \"connectors\": \"Not Assessed\",
              \"database\": \"Not Assessed\",
              \"messaging\": \"Not Assessed\",
              \"performance\": \"Not Assessed\",
              \"munit\": \"Not Assessed\",
              \"maven\": \"Not Assessed\",
              \"configuration\": \"Not Assessed\"
            },
            \"reviewControls\": {
              \"sourceReadOnly\": true,
              \"evidenceBased\": true,
              \"secretsExposed\": false
            }
          }

          IMPORTANT:

          Do not merely print or describe the JSON.

          Actually invoke the Write tool and create:

          $REVIEW_FILE

          After writing the file, use the Read tool to read the same file back.

          Then verify that:
          1. The file exists.
          2. The file is non-empty.
          3. The contents are valid JSON.
          4. The root is a JSON object.
          5. findings is an array.
          6. The finding contains id, severity, category, title, location, confidence, problem, evidence, impact, and recommendation.

          Only after successfully writing and reading the file respond with exactly:

          REVIEW_JSON_WRITE_TEST_COMPLETED"

              echo
              echo "=========================================================="
              echo "VERIFY REVIEW.JSON"
              echo "=========================================================="

              if [ ! -f "$REVIEW_FILE" ]; then
                echo "ERROR: Claude did not create:"
                echo "$REVIEW_FILE"
                exit 1
              fi

              if [ ! -s "$REVIEW_FILE" ]; then
                echo "ERROR: review.json is empty."
                exit 1
              fi

              python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["APPLICATION_ROOT"])
              / "workspace"
              / "execution"
              / "review.json"
          )

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"ERROR: Invalid JSON: {exc}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: review.json must contain a JSON object.")

          if not isinstance(data.get("findings"), list):
              raise SystemExit("ERROR: findings must be an array.")

          required = {
              "id",
              "severity",
              "category",
              "title",
              "location",
              "confidence",
              "problem",
              "evidence",
              "impact",
              "recommendation",
          }

          for finding in data["findings"]:
              missing = required - finding.keys()

              if missing:
                  raise SystemExit(
                      f"ERROR: Finding missing fields: {sorted(missing)}"
                  )

          print("SUCCESS: Claude created a valid structured review.json.")
          print()
          print(f"Path: {path}")
          print()
          print("Contents:")
          print(json.dumps(data, indent=2))
          PY
       
        # ======================================================
         # Temp code
        # ======================================================
        

      # ==========================================================
      # VERIFY CLAUDE OUTPUT
      # ==========================================================

      - name: Verify review output
        run: |
          set -euo pipefail

          REVIEW_FILE="$APPLICATION_ROOT/workspace/execution/review.json"

          echo "Review output file:"
          echo "$REVIEW_FILE"

          if [[ ! -f "$REVIEW_FILE" ]]; then
            echo "::error::Claude did not create $REVIEW_FILE"
            exit 1
          fi

          if [[ ! -s "$REVIEW_FILE" ]]; then
            echo "::error::$REVIEW_FILE is empty."
            exit 1
          fi

          ls -lh "$REVIEW_FILE"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("workspace/execution/review.json")

          if not path.exists():
              raise SystemExit(
                  f"review.json does not exist: {path}"
              )

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"review.json contains invalid JSON: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "review.json must contain a JSON object."
              )

          findings = data.get("findings", [])

          if not isinstance(findings, list):
              raise SystemExit(
                  "review.json 'findings' must be an array."
              )

          print("review.json validation passed.")
          print(f"Finding count: {len(findings)}")
          PY


      # ==========================================================
      # VALIDATE STRUCTURED REVIEW
      # ==========================================================

      - name: Validate review
        run: |
          set -euo pipefail

          VALIDATE_SCRIPT="$REVIEW_KIT_ROOT/scripts/validate_review.py"
          REVIEW_FILE="$APPLICATION_ROOT/workspace/execution/review.json"
          VALIDATED_FILE="$APPLICATION_ROOT/workspace/execution/validated-review.json"

          echo "Validation script:"
          echo "$VALIDATE_SCRIPT"

          echo
          echo "Review file:"
          echo "$REVIEW_FILE"

          if [[ ! -f "$VALIDATE_SCRIPT" ]]; then
            echo "::error::Validation script not found: $VALIDATE_SCRIPT"
            exit 1
          fi

          if [[ ! -f "$REVIEW_FILE" ]]; then
            echo "::error::Review file not found: $REVIEW_FILE"
            exit 1
          fi

          cd "$APPLICATION_ROOT"

          python3 "$VALIDATE_SCRIPT"

          if [[ ! -f "$VALIDATED_FILE" ]]; then
            echo "::error::validated-review.json was not generated."
            exit 1
          fi

          if [[ ! -s "$VALIDATED_FILE" ]]; then
            echo "::error::validated-review.json is empty."
            exit 1
          fi

          echo "Validated review generated:"
          ls -lh "$VALIDATED_FILE"


      # ==========================================================
      # GENERATE OFFICIAL WORD REPORT
      # ==========================================================

      - name: Generate Word report
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          REPORT_SCRIPT="$APPLICATION_ROOT/scripts/generate_report.py"

          if [[ ! -f "$REPORT_SCRIPT" ]]; then
            echo "::error::Report generation script not found: $REPORT_SCRIPT"
            exit 1
          fi

          python3 "$REPORT_SCRIPT"

          echo
          echo "Generated reports:"
          find "$APPLICATION_ROOT/reports" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # ==========================================================
      # VALIDATE GENERATED WORD DOCUMENT
      # ==========================================================

      - name: Validate generated report
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          from docx import Document

          reports = list(
              Path("reports").glob(
                  "CODE_REVIEW_REPORT_*.docx"
              )
          )

          if len(reports) != 1:
              raise SystemExit(
                  "Expected exactly one final Word report; "
                  f"found {len(reports)}."
              )

          report = reports[0]

          if report.stat().st_size == 0:
              raise SystemExit(
                  "Generated Word report is empty."
              )

          document = Document(report)

          paragraphs = "\n".join(
              paragraph.text
              for paragraph in document.paragraphs
          )

          required_sections = [
              "CODE REVIEW REPORT",
              "1. EXECUTIVE SUMMARY",
              "2. APPLICATION INVENTORY",
              "3. FINDINGS",
              "4. CATEGORY ASSESSMENTS",
              "5. PRODUCTION READINESS ASSESSMENT",
              "6. RISK AND RECOMMENDATION",
              "APPENDIX A",
              "APPENDIX B",
              "APPENDIX C",
          ]

          missing = [
              section
              for section in required_sections
              if section not in paragraphs
          ]

          if missing:
              raise SystemExit(
                  "Generated report is missing required sections: "
                  + ", ".join(missing)
              )

          print(
              f"Report validated successfully: {report}"
          )
          PY


      # ==========================================================
      # VERIFY APPLICATION SOURCE INTEGRITY
      #
      # workspace/ and reports/ are generated review artifacts.
      # Any other modification is a failure.
      # ==========================================================

      - name: Verify source integrity
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          git status --short \
            > workspace/execution/git-status-after.txt

          git diff --binary \
            > workspace/execution/git-diff-after.patch

          git diff --cached --binary \
            > workspace/execution/git-diff-cached-after.patch

          python3 - <<'PY'
          import subprocess

          generated_prefixes = (
              "workspace/",
              "reports/",
          )

          result = subprocess.run(
              ["git", "status", "--short"],
              capture_output=True,
              text=True,
              check=True,
          )

          unexpected = []

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              # Git status --short normally has two status columns
              # followed by a space and the path.
              path = line[3:].strip()

              # Handle rename/copy output such as:
              # R  old -> new
              if " -> " in path:
                  path = path.split(" -> ", 1)[1].strip()

              if path.startswith(generated_prefixes):
                  continue

              unexpected.append(line)

          if unexpected:
              print(
                  "Unexpected repository modifications detected:"
              )

              for item in unexpected:
                  print(item)

              raise SystemExit(
                  "Application source integrity check failed."
              )

          working_tree = subprocess.run(
              ["git", "diff", "--exit-code"],
              check=False,
          )

          if working_tree.returncode != 0:
              raise SystemExit(
                  "Uncommitted application source changes detected."
              )

          staged = subprocess.run(
              ["git", "diff", "--cached", "--exit-code"],
              check=False,
          )

          if staged.returncode != 0:
              raise SystemExit(
                  "Staged application source changes detected."
              )

          print(
              "Application source integrity confirmed."
          )
          PY


      # ==========================================================
      # DISPLAY FINAL REVIEW RESULT
      # ==========================================================

      - name: Display review result
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workspace/execution/validated-review.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Validated review does not exist: {path}"
              )

          review = json.loads(
              path.read_text(encoding="utf-8")
          )

          findings = review.get("findings", [])

          counts = {
              severity: sum(
                  1
                  for finding in findings
                  if finding.get("severity") == severity
              )
              for severity in (
                  "CRITICAL",
                  "HIGH",
                  "MEDIUM",
                  "LOW",
                  "NIT",
              )
          }

          report_files = list(
              Path("reports").glob(
                  "CODE_REVIEW_REPORT_*.docx"
              )
          )

          report = (
              str(report_files[0])
              if len(report_files) == 1
              else "Not generated"
          )

          print("")
          print("========================================")
          print("MuleSoft Code Review")
          print("========================================")
          print(
              f"Overall Risk:       "
              f"{review.get('overallRisk', 'LOW')}"
          )
          print(
              f"Recommendation:     "
              f"{review.get('overallRecommendation', 'APPROVE')}"
          )
          print(
              f"CRITICAL:           {counts['CRITICAL']}"
          )
          print(
              f"HIGH:               {counts['HIGH']}"
          )
          print(
              f"MEDIUM:             {counts['MEDIUM']}"
          )
          print(
              f"LOW:                {counts['LOW']}"
          )
          print(
              f"NIT:                {counts['NIT']}"
          )
          print(
              f"TOTAL:              {len(findings)}"
          )
          print(
              f"Report:             {report}"
          )
          print("========================================")
          PY


      # ==========================================================
      # UPLOAD OFFICIAL WORD REPORT
      # ==========================================================

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mule-code-review-report
          path: reports/CODE_REVIEW_REPORT_*.docx
          if-no-files-found: error


      # ==========================================================
      # UPLOAD EXECUTION EVIDENCE
      #
      # These are workflow artifacts, not official review reports.
      # ==========================================================

      - name: Upload review execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mule-code-review-execution
          path: |
            workspace/execution/application-discovery.json
            workspace/execution/review-evidence.json
            workspace/execution/review.json
            workspace/execution/validated-review.json
            workspace/execution/review-summary.txt
            workspace/execution/git-status-before.txt
            workspace/execution/git-status-after.txt
            workspace/execution/git-diff-before.patch
            workspace/execution/git-diff-after.patch
            workspace/execution/git-diff-cached-before.patch
            workspace/execution/git-diff-cached-after.patch
          if-no-files-found: warn
