name: Reusable - MuleSoft Code Review

on:
  workflow_call:

jobs:

  # ============================================================
  # MULESOFT CODE REVIEW
  # ============================================================

  code-review:
    name: MuleSoft Code Review
    runs-on: ubuntu-latest
    environment: DEV

    permissions:
      contents: read

    env:
      REVIEW_KIT_REPO: dineshvallabhaneni-telus/mulesoft-claude-code-review
      REVIEW_KIT_REF: dev
      REVIEW_KIT_DIR: .mule-code-review
      APPLICATION_ROOT: ${{ github.workspace }}
      REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:

      # ==========================================================
      # CHECK ANTHROPIC API KEY
      # ==========================================================

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        run: |
          set -euo pipefail

          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================================
      # SETUP NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"


      # ==========================================================
      # CHECKOUT MULE APPLICATION
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # CHECKOUT REVIEW FRAMEWORK
      # ==========================================================

      - name: Checkout review kit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REVIEW_KIT_REPO }}
          ref: ${{ env.REVIEW_KIT_REF }}
          path: ${{ env.REVIEW_KIT_DIR }}
          token: ${{ secrets.GIT_TOKEN }}


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet python-docx

          npm install --global --silent newman


      # ==========================================================
      # INSTALL CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          set -euo pipefail

          npm install --global --silent @anthropic-ai/claude-code

          echo "Claude Code installed."
          claude --version

      # ==========================================================
      # CLAUDE CODE REVIEW
      # ==========================================================
      - name: Run validation workflow
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional:
          # ANTHROPIC_MODEL: <fuel-model-id>

        run: |
          set -o pipefail

          cat "$REVIEW_KIT_ROOT/prompts/mule-full-review.md" | claude \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --output-format text \
            | tee summary.txt
      # ==========================================================
      # UPLOAD TEST REPORT
      # ==========================================================

      - name: Upload test report
        if: always()

        uses: actions/upload-artifact@v7

        with:
          name: mulesoft-test-results

          path: |
            ${{ github.workspace }}

          if-no-files-found: warn

          retention-days: 90


      # ==========================================================
      # TEST RESULT
      # ==========================================================

      - name: Fail the job on failed tests
        if: always()

        shell: bash

        run: |
          set -euo pipefail

          if ! grep -q '^Overall Status: PASS' summary.txt; then
            echo "::error::Test Results did not pass. See the uploaded report."
            exit 1
          fi