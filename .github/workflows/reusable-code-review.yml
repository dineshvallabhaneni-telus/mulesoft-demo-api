name: Reusable - MuleSoft Code Review

on:
  workflow_call:

jobs:

  # ============================================================
  # MULESOFT CODE REVIEW
  # ============================================================

  code-review:
    name: MuleSoft Code Review
    runs-on: ubuntu-latest
    environment: DEV
    timeout-minutes: 150

    permissions:
      contents: read

    env:
      APPLICATION_ROOT: ${{ github.workspace }}/application
      APPLICATION_BRANCH: develop
      REVIEW_KIT_REPO: dineshvallabhaneni-telus/mulesoft-claude-code-review
      REVIEW_KIT_ROOT: ${{ github.workspace }}/code-review
      REVIEW_FRAMEWORK_BRANCH: code-review
      ANTHROPIC_BASE_URL: https://api.fuelix.ai
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:

      # ==========================================================
      # CHECK ANTHROPIC AUTH TOKEN
      # ==========================================================

      - name: Check ANTHROPIC_AUTH_TOKEN
        run: |
          set -euo pipefail

          if [[ -z "$ANTHROPIC_AUTH_TOKEN" ]]; then
            echo "::error::ANTHROPIC_AUTH_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_AUTH_TOKEN is configured."


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================================
      # SETUP NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"


      # ==========================================================
      # CHECKOUT MULE APPLICATION
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.APPLICATION_BRANCH }}
          path: ${{ env.APPLICATION_ROOT }}
          fetch-depth: 0

      # ==========================================================
      # CHECKOUT REVIEW FRAMEWORK
      # ==========================================================

      - name: Checkout review kit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REVIEW_KIT_REPO }}
          ref: ${{ env.REVIEW_FRAMEWORK_BRANCH }}
          path: ${{ env.REVIEW_KIT_ROOT }}
          token: ${{ secrets.GIT_TOKEN }}

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            jq \
            xmlstarlet

          npm install --global --silent newman

          # Required by scripts/generate-report.py. Without these the Word
          # document cannot be produced.
          echo ""
          echo "Installing Word report libraries..."

          python3 -m pip install --upgrade pip
          python3 -m pip install python-docx matplotlib

          python3 - <<'PY'
          import docx
          import matplotlib
          print("python-docx :", docx.__version__)
          print("matplotlib  :", matplotlib.__version__)
          PY

          mkdir -p "${GITHUB_WORKSPACE}/reports"

          echo ""
          echo "Installed dependencies successfully."

      # ==========================================================
      # INSTALL CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          set -euo pipefail

          npm install --global --silent @anthropic-ai/claude-code

          echo "Claude Code installed."
          claude --version

      # ==========================================================
      # PREPARE REVIEW WORKSPACE
      #
      # Registers the specialist agents and review skills under
      # <workspace>/.claude so the Claude CLI can discover them, and
      # verifies the report generator dependencies.
      # ==========================================================

      - name: Prepare review workspace
        run: |
          set -Eeuo pipefail

          chmod +x "${REVIEW_KIT_ROOT}/scripts/"*.sh

          "${REVIEW_KIT_ROOT}/scripts/prepare-workspace.sh"

      # ==========================================================
      # CLAUDE CODE REVIEW
      #
      # run-review.sh invokes Claude, then guarantees a .docx: if the
      # review produced review-findings.json but no document, it renders
      # the report itself. It fails the step if neither exists.
      # ==========================================================

      - name: Run MuleSoft Enterprise Code Review
        env:
          # Leave empty to use the gateway's default model. Set the repository
          # variable CLAUDE_MODEL to pin a specific FuelIX model identifier.
        #  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_TIMEOUT_SECONDS: "7200"
        run: |
          set -Eeuo pipefail

          echo "Running MuleSoft Enterprise Code Review..."

          "${REVIEW_KIT_ROOT}/scripts/run-review.sh"

      # ==========================================================
      # VALIDATE REPORT
      # ==========================================================

      - name: Validate MuleSoft review report
        run: |
          set -Eeuo pipefail

          "${REVIEW_KIT_ROOT}/scripts/validate-report.sh"

      # ==========================================================
      # LOCATE REPORT
      # ==========================================================

      - name: Locate final report
        id: report
        run: |
          set -Eeuo pipefail

          REPORT="$(find "${GITHUB_WORKSPACE}/reports" \
            -maxdepth 1 \
            -type f \
            -name 'mulesoft-standards-review_*.docx' \
            | sort \
            | tail -1)"

          if [[ -z "${REPORT}" ]]; then
            echo "::error::Final report was not found."
            exit 1
          fi

          echo "report=${REPORT}" >> "${GITHUB_OUTPUT}"
          echo "report_name=$(basename "${REPORT}")" >> "${GITHUB_OUTPUT}"

          echo "Report: ${REPORT}"

      # ==========================================================
      # UPLOAD WORD REPORT
      # ==========================================================

      - name: Upload MuleSoft review report
        uses: actions/upload-artifact@v7
        with:
          name: mulesoft-standards-review
          path: ${{ steps.report.outputs.report }}
          if-no-files-found: error
          retention-days: 90

      # ==========================================================
      # UPLOAD REVIEW DIAGNOSTICS
      #
      # Only the review artefacts are uploaded - never the application
      # source or the checked-out git metadata.
      # ==========================================================

      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mulesoft-code-review-diagnostics
          path: |
            ${{ github.workspace }}/reports/review-findings.json
            ${{ github.workspace }}/reports/claude-review-output.log
            ${{ github.workspace }}/reports/claude-review-stream.jsonl
          if-no-files-found: warn
          retention-days: 30

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Review completed
        run: |
          set -Eeuo pipefail

          {
            echo "## MuleSoft Standards Review"
            echo ""
            echo "Report: \`${{ steps.report.outputs.report_name }}\`"
            echo ""
            echo "Download it from the **mulesoft-standards-review** artifact."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Download full report: ${{ steps.report.outputs.report }}"
