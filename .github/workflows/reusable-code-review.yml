name: Reusable - MuleSoft Code Review

on:
  workflow_call:

jobs:

  # ============================================================
  # MULESOFT CODE REVIEW
  # ============================================================

  code-review:
    name: MuleSoft Code Review
    runs-on: ubuntu-latest
    environment: DEV

    permissions:
      contents: read

    env:
      REVIEW_KIT_REPO: dineshvallabhaneni-telus/mulesoft-claude-code-review
      REVIEW_KIT_REF: develop
      REVIEW_KIT_DIR: .mule-code-review-kit
      APPLICATION_ROOT: ${{ github.workspace }}
      REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review-kit

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:

      # ==========================================================
      # CHECK ANTHROPIC API KEY
      # ==========================================================

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        run: |
          set -euo pipefail

          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================================
      # SETUP NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"


      # ==========================================================
      # CHECKOUT MULE APPLICATION
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # CHECKOUT REVIEW FRAMEWORK
      # ==========================================================

      - name: Checkout review kit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REVIEW_KIT_REPO }}
          ref: ${{ env.REVIEW_KIT_REF }}
          path: ${{ env.REVIEW_KIT_DIR }}
          token: ${{ secrets.GIT_TOKEN }}


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet python-docx

          npm install --global --silent newman


      # ==========================================================
      # INSTALL CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          set -euo pipefail

          npm install --global --silent @anthropic-ai/claude-code

          echo "Claude Code installed."
          claude --version


      # ==========================================================
      # VALIDATE REVIEW FRAMEWORK
      # ==========================================================

      - name: Validate framework structure
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "WORKSPACE"
          echo "=========================================================="

          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          echo
          echo "=========================================================="
          echo "FRAMEWORK ROOT"
          echo "=========================================================="

          echo "$REVIEW_KIT_ROOT"

          if [[ ! -d "$REVIEW_KIT_ROOT" ]]; then
            echo "::error::Review kit directory does not exist: $REVIEW_KIT_ROOT"
            exit 1
          fi

          echo
          echo "=========================================================="
          echo "FRAMEWORK CONTENTS"
          echo "=========================================================="

          find "$REVIEW_KIT_ROOT" \
            -maxdepth 5 \
            -type f \
            -not -path "*/.git/*" \
            | sort

          echo
          echo "=========================================================="
          echo "CHECK REQUIRED FILES"
          echo "=========================================================="

          REQUIRED_FILES=(
            "$REVIEW_KIT_ROOT/CLAUDE.md"
            "$REVIEW_KIT_ROOT/prompts/mule-code-review.md"
            "$REVIEW_KIT_ROOT/scripts/collect_review_evidence.py"
            "$REVIEW_KIT_ROOT/scripts/validate_review.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required framework file not found: $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo
          echo "Framework structure validated."


      # ==========================================================
      # PREPARE REVIEW WORKSPACE
      # ==========================================================

      - name: Prepare review workspace
        run: |
          set -euo pipefail

          echo "Application root: $APPLICATION_ROOT"
          echo "Review kit root: $REVIEW_KIT_ROOT"

          mkdir -p "$APPLICATION_ROOT/workspace/execution"
          mkdir -p "$APPLICATION_ROOT/reports"

          echo
          echo "Required prompt:"
          echo "$REVIEW_KIT_ROOT/prompts/mule-code-review.md"

          echo
          echo "Review workspace prepared."

          ls -la "$APPLICATION_ROOT"
          ls -la "$APPLICATION_ROOT/workspace"
          ls -la "$APPLICATION_ROOT/workspace/execution"


      # ==========================================================
      # COLLECT DETERMINISTIC REPOSITORY EVIDENCE
      # ==========================================================

      - name: Collect review evidence
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          python3 "$REVIEW_KIT_ROOT/scripts/collect_review_evidence.py"

          REVIEW_EVIDENCE="$APPLICATION_ROOT/workspace/execution/review-evidence.json"

          if [[ ! -f "$REVIEW_EVIDENCE" ]]; then
            echo "::error::Review evidence was not generated: $REVIEW_EVIDENCE"
            exit 1
          fi

          if [[ ! -s "$REVIEW_EVIDENCE" ]]; then
            echo "::error::Review evidence file is empty: $REVIEW_EVIDENCE"
            exit 1
          fi

          echo "Evidence output:"
          echo "$REVIEW_EVIDENCE"

          ls -lh "$REVIEW_EVIDENCE"


      # ==========================================================
      # CAPTURE REPOSITORY STATE BEFORE CLAUDE
      # ==========================================================

      - name: Capture source state
        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          mkdir -p "$APPLICATION_ROOT/workspace/execution"

          git status --short \
            > "$APPLICATION_ROOT/workspace/execution/git-status-before.txt"

          git diff --binary \
            > "$APPLICATION_ROOT/workspace/execution/git-diff-before.patch"

          git diff --cached --binary \
            > "$APPLICATION_ROOT/workspace/execution/git-diff-cached-before.patch"

          echo "Repository state captured."

          echo
          echo "Application Root:"
          echo "$APPLICATION_ROOT"

          echo
          echo "Execution Evidence:"
          echo "$APPLICATION_ROOT/workspace/execution"

          echo
          echo "Git status before Claude:"
          cat "$APPLICATION_ROOT/workspace/execution/git-status-before.txt" || true


      # ==========================================================
      # RUN MULESOFT CODE REVIEW
      # ==========================================================

      # - name: Run MuleSoft code review
      #   env:
      #     ANTHROPIC_BASE_URL: https://api.fuelix.ai
      #     ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
      #     APPLICATION_ROOT: ${{ github.workspace }}
