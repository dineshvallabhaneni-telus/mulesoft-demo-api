name: Reusable - MuleSoft Code Review

on:
  workflow_call:


jobs:

  # ============================================================
  # MULESOFT CODE REVIEW
  # ============================================================

  code-review:
    name: MuleSoft Code Review

    runs-on: ubuntu-latest

    environment: DEV

    permissions:
      contents: read

    env:
      REVIEW_KIT_REPO: dineshvallabhaneni-telus/mulesoft-claude-code-review
      REVIEW_KIT_REF: develop
      REVIEW_KIT_DIR: .mule-code-review-kit
      APPLICATION_ROOT: ${{ github.workspace }}
      REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review-kit

    steps:

      # ==========================================================
      # CHECK ANTHROPIC API KEY
      # ==========================================================

      - name: Check ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

        shell: bash

        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not configured in GitHub Secrets."
            exit 1
          fi

          echo "ANTHROPIC_API_KEY is configured."


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      # ==========================================================
      # SETUP NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip

          python3 -m pip install --quiet python-docx

          npm install --global --silent newman


      # ==========================================================
      # INSTALL CLAUDE CODE
      # ==========================================================

      - name: Install Claude Code
        run: |
          npm install --global --silent @anthropic-ai/claude-code


      # ==========================================================
      # CHECKOUT Mule Application
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # CHECKOUT Review Framework
      # ==========================================================

      - name: Checkout review kit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REVIEW_KIT_REPO }}
          ref: ${{ env.REVIEW_KIT_REF }}
          path: ${{ env.REVIEW_KIT_DIR }}
          token: ${{ secrets.GIT_TOKEN }}

      # ------------------------------------------------------------
      # Validate framework structure
      #
      # The repository root is both:
      #   - application root
      #   - framework root
      # ------------------------------------------------------------
      - name: Validate framework structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "WORKSPACE"
          echo "=========================================================="
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo

          echo "=========================================================="
          echo "FRAMEWORK ROOT"
          echo "=========================================================="
          echo "$GITHUB_WORKSPACE/.mule-code-review-kit"
          echo

          echo "=========================================================="
          echo "FRAMEWORK CONTENTS"
          echo "=========================================================="

          find "$GITHUB_WORKSPACE/.mule-code-review-kit" \
            -maxdepth 4 \
            -type f \
            -not -path "*/.git/*" \
            | sort

          echo
          echo "=========================================================="
          echo "CHECK CLAUDE.md"
          echo "=========================================================="

          if [[ -f "$GITHUB_WORKSPACE/.mule-code-review-kit/CLAUDE.md" ]]; then
            echo "FOUND:"
            echo "$GITHUB_WORKSPACE/.mule-code-review-kit/CLAUDE.md"
          else
            echo "ERROR: CLAUDE.md not found in framework root"
            exit 1
          fi
      # ------------------------------------------------------------
      #  Prepare review workspace
      # ------------------------------------------------------------
      - name: Prepare review workspace
        env: 
          APPLICATION_ROOT: ${{ github.workspace }}
          REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review-kit

        run: |
          set -euo pipefail

          echo "Application root: $APPLICATION_ROOT"
          echo "Review kit root: $REVIEW_KIT_ROOT"

          mkdir -p "$APPLICATION_ROOT/workspace/execution"
          mkdir -p "$APPLICATION_ROOT/reports"

          echo "$REVIEW_KIT_ROOT/CLAUDE.md"
          echo "$REVIEW_KIT_ROOT/prompts/mule-code-review-prompt.md"

          echo "Review workspace prepared."

      # ------------------------------------------------------------
      #  Collect deterministic repository evidence
      # ------------------------------------------------------------
      - name: Collect review evidence
        env:
          APPLICATION_ROOT: ${{ github.workspace }}
          REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review-kit

        shell: bash

        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          python3 "$REVIEW_KIT_ROOT/scripts/collect_review_evidence.py"

          test -f "$APPLICATION_ROOT/workspace/execution/review-evidence.json"

          echo "Evidence output:"
          echo "$APPLICATION_ROOT/workspace/execution/review-evidence.json"

      # ------------------------------------------------------------
      #  Capture repository state before Claude
      # ------------------------------------------------------------
      - name: Capture source state
        env:
          APPLICATION_ROOT: ${{ github.workspace }}

        shell: bash

        run: |
          set -euo pipefail

          cd "$APPLICATION_ROOT"

          mkdir -p "$APPLICATION_ROOT/workspace/execution"

          git status --short \
            > "$APPLICATION_ROOT/workspace/execution/git-status-before.txt"

          git diff --binary \
            > "$APPLICATION_ROOT/workspace/execution/git-diff-before.patch"

          git diff --cached --binary \
            > "$APPLICATION_ROOT/workspace/execution/git-diff-cached-before.patch"

          echo "Repository state captured."
          echo
          echo "Application Root:"
          echo "$APPLICATION_ROOT"
          echo
          echo "Execution Evidence:"
          echo "$APPLICATION_ROOT/workspace/execution"

      # ==========================================================
      # RUN MULESOFT CODE REVIEW
      # ==========================================================

      - name: Run MuleSoft code review
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLICATION_ROOT: ${{ github.workspace }}
          REVIEW_KIT_ROOT: ${{ github.workspace }}/.mule-code-review-kit
          # Optional:
          # ANTHROPIC_MODEL: <fuel-model-id>

        shell: bash

        run: |
          set -euo pipefail

          echo "Application root:"
          echo " $APPLICATION_ROOT"

          echo "Review kit root:"
          echo " $REVIEW_KIT_ROOT"

          echo "Review output:"
          echo "$APPLICATION_ROOT/workspace/execution/review.json"

          echo "Starting MuleSoft code review..."

          cat "$REVIEW_KIT_ROOT/prompts/mule-code-review.md" | claude \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --output-format text \
            | tee "$APPLICATION_ROOT/workspace/execution/review-summary.txt"

          echo "MuleSoft code review completed."


      # ------------------------------------------------------------
      # Verify Claude output
      # ------------------------------------------------------------
      - name: Verify review output
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="workspace/execution/review.json"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "ERROR: Claude did not create $REVIEW_FILE"
            exit 1
          fi

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "ERROR: $REVIEW_FILE is empty."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("workspace/execution/review.json")

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"review.json contains invalid JSON: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "review.json must contain a JSON object."
              )

          findings = data.get("findings", [])

          if not isinstance(findings, list):
              raise SystemExit(
                  "review.json 'findings' must be an array."
              )

          print("review.json validation passed.")
          print(f"Finding count: {len(findings)}")
          PY

      # ------------------------------------------------------------
      # Validate structured review
      # ------------------------------------------------------------
      - name: Validate review
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_review.py

          if [ ! -f "workspace/execution/validated-review.json" ]; then
            echo "ERROR: validated-review.json was not generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # Generate official Word report
      # ------------------------------------------------------------
      - name: Generate Word report
        shell: bash
        run: |
          set -euo pipefail

          python scripts/generate_report.py

      # ------------------------------------------------------------
      # Validate generated Word document
      # ------------------------------------------------------------
      - name: Validate generated report
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          from docx import Document

          reports = list(
              Path("reports").glob(
                  "CODE_REVIEW_REPORT_*.docx"
              )
          )

          if len(reports) != 1:
              raise SystemExit(
                  "Expected exactly one final Word report; "
                  f"found {len(reports)}."
              )

          report = reports[0]

          if report.stat().st_size == 0:
              raise SystemExit(
                  "Generated Word report is empty."
              )

          document = Document(report)

          paragraphs = "\n".join(
              paragraph.text
              for paragraph in document.paragraphs
          )

          required_sections = [
              "CODE REVIEW REPORT",
              "1. EXECUTIVE SUMMARY",
              "2. APPLICATION INVENTORY",
              "3. FINDINGS",
              "4. CATEGORY ASSESSMENTS",
              "5. PRODUCTION READINESS ASSESSMENT",
              "6. RISK AND RECOMMENDATION",
              "APPENDIX A",
              "APPENDIX B",
              "APPENDIX C",
          ]

          missing = [
              section
              for section in required_sections
              if section not in paragraphs
          ]

          if missing:
              raise SystemExit(
                  "Generated report is missing required sections: "
                  + ", ".join(missing)
              )

          print(f"Report validated successfully: {report}")
          PY

      # ------------------------------------------------------------
      # Verify application source integrity
      #
      # workspace/ and reports/ are generated review artifacts.
      # Any other modification is a failure.
      # ------------------------------------------------------------
      - name: Verify source integrity
        shell: bash
        run: |
          set -euo pipefail

          git status --short \
            > workspace/execution/git-status-after.txt

          git diff --binary \
            > workspace/execution/git-diff-after.patch

          git diff --cached --binary \
            > workspace/execution/git-diff-cached-after.patch

          python - <<'PY'
          import subprocess

          generated_prefixes = (
              "workspace/",
              "reports/",
          )

          result = subprocess.run(
              ["git", "status", "--short"],
              capture_output=True,
              text=True,
              check=True,
          )

          unexpected = []

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              path = line[3:].strip()

              if path.startswith(generated_prefixes):
                  continue

              unexpected.append(line)

          if unexpected:
              print(
                  "Unexpected repository modifications detected:"
              )

              for item in unexpected:
                  print(item)

              raise SystemExit(
                  "Application source integrity check failed."
              )

          working_tree = subprocess.run(
              ["git", "diff", "--exit-code"],
              check=False,
          )

          if working_tree.returncode != 0:
              raise SystemExit(
                  "Uncommitted application source changes detected."
              )

          staged = subprocess.run(
              ["git", "diff", "--cached", "--exit-code"],
              check=False,
          )

          if staged.returncode != 0:
              raise SystemExit(
                  "Staged application source changes detected."
              )

          print(
              "Application source integrity confirmed."
          )
          PY

      # ------------------------------------------------------------
      # Print final review result
      # ------------------------------------------------------------
      - name: Display review result
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workspace/execution/validated-review.json"
          )

          review = json.loads(
              path.read_text(encoding="utf-8")
          )

          findings = review.get("findings", [])

          counts = {
              severity: sum(
                  1
                  for finding in findings
                  if finding.get("severity") == severity
              )
              for severity in (
                  "CRITICAL",
                  "HIGH",
                  "MEDIUM",
                  "LOW",
                  "NIT",
              )
          }

          report_files = list(
              Path("reports").glob(
                  "CODE_REVIEW_REPORT_*.docx"
              )
          )

          report = (
              str(report_files[0])
              if len(report_files) == 1
              else "Not generated"
          )

          print("")
          print("========================================")
          print("MuleSoft Code Review")
          print("========================================")
          print(
              f"Overall Risk:       "
              f"{review.get('overallRisk', 'LOW')}"
          )
          print(
              f"Recommendation:     "
              f"{review.get('overallRecommendation', 'APPROVE')}"
          )
          print(
              f"CRITICAL:           {counts['CRITICAL']}"
          )
          print(
              f"HIGH:               {counts['HIGH']}"
          )
          print(
              f"MEDIUM:             {counts['MEDIUM']}"
          )
          print(
              f"LOW:                {counts['LOW']}"
          )
          print(
              f"NIT:                {counts['NIT']}"
          )
          print(
              f"TOTAL:              {len(findings)}"
          )
          print(
              f"Report:             {report}"
          )
          print("========================================")
          PY

      # ------------------------------------------------------------
      # 17. Upload official Word report
      # ------------------------------------------------------------
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mule-code-review-report
          path: reports/CODE_REVIEW_REPORT_*.docx
          if-no-files-found: error

      # ------------------------------------------------------------
      # 18. Upload execution evidence
      #
      # These are workflow artifacts, not official review reports.
      # ------------------------------------------------------------
      - name: Upload review execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mule-code-review-execution
          path: |
            workspace/execution/application-discovery.json
            workspace/execution/review-evidence.json
            workspace/execution/review.json
            workspace/execution/validated-review.json
          if-no-files-found: warn
