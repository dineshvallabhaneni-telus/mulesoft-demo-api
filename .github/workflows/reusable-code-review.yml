      #   run: |
      #     set -euo pipefail

      #     cd "$APPLICATION_ROOT"

      #     REVIEW_PROMPT="$REVIEW_KIT_ROOT/prompts/mule-code-review.md"
      #     REVIEW_OUTPUT="$APPLICATION_ROOT/workspace/execution/review.json"
      #     REVIEW_SUMMARY="$APPLICATION_ROOT/workspace/execution/review-summary.txt"

      #     echo "=========================================================="
      #     echo "MULESOFT CODE REVIEW"
      #     echo "=========================================================="

      #     echo "Application root:"
      #     echo "$APPLICATION_ROOT"

      #     echo
      #     echo "Review kit root:"
      #     echo "$REVIEW_KIT_ROOT"

      #     echo
      #     echo "Review prompt:"
      #     echo "$REVIEW_PROMPT"

      #     echo
      #     echo "Expected review output:"
      #     echo "$REVIEW_OUTPUT"

      #     if [[ ! -f "$REVIEW_PROMPT" ]]; then
      #       echo "::error::Review prompt not found: $REVIEW_PROMPT"
      #       exit 1
      #     fi

      #     echo
      #     echo "Starting MuleSoft code review..."

      #     claude \
      #       --permission-mode acceptEdits \
      #       --allowedTools "Bash,Read,Write,Glob,Grep" \
      #       --output-format text \
      #       < "$REVIEW_PROMPT" \
      #       | tee "$REVIEW_SUMMARY"

      #     echo
      #     echo "Claude execution completed."

      #     echo
      #     echo "=========================================================="
      #     echo "FILES GENERATED BY CLAUDE"
      #     echo "=========================================================="

      #     find "$APPLICATION_ROOT/workspace" \
      #       -maxdepth 5 \
      #       -type f \
      #       -print \
      #       | sort

      #     echo
      #     echo "=========================================================="
      #     echo "CHECK REVIEW OUTPUT"
      #     echo "=========================================================="

      #     if [[ ! -f "$REVIEW_OUTPUT" ]]; then
      #       echo "::error::Claude did not create $REVIEW_OUTPUT"

      #       echo
      #       echo "Workspace contents:"
      #       find "$APPLICATION_ROOT/workspace" \
      #         -maxdepth 5 \
      #         -print \
      #         | sort

      #       exit 1
